<svg xmlns="http://www.w3.org/2000/svg" width="320" height="350" viewBox="0 0 320 350" role="img" aria-labelledby="title desc"><title id="title">Possible connections to investigate</title><desc id="desc">Socialization, through family, peers and media, connects to cultural expectations and romantic preferences. A conceptual diagram, not a proven causal sequence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#225c50"/></marker></defs><g fill="#fffefa" stroke="#9bb29e"><rect x="1" y="1" width="318" height="90" rx="5"/><rect x="1" y="129" width="318" height="90" rx="5"/><rect x="1" y="257" width="318" height="90" rx="5"/></g><g fill="none" stroke="#225c50" stroke-width="2" marker-end="url(#arrow)"><path d="M160 99V120"/><path d="M160 227V248"/></g><g font-family="system-ui,sans-serif" fill="#203c39" text-anchor="middle"><text x="160" y="40" font-size="23">Socialization</text><text x="160" y="168" font-size="23">Cultural expectations</text><text x="160" y="296" font-size="23">Romantic preferences</text><g font-size="16"><text x="160" y="67">Family, peers &amp; media</text><text x="160" y="195">Messages about attractiveness</text><text x="160" y="323">“My type”</text></g></g></svg>